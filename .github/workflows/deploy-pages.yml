name: Deploy documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout doc4.ec-cube.net
        uses: actions/checkout@v4

      - name: Checkout eccube-api4
        uses: actions/checkout@v4
        with:
          repository: EC-CUBE/eccube-api4
          path: external/eccube-api4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install doc4 dependencies
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Build doc4 documentation
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --destination "${GITHUB_WORKSPACE}/_site"

      - name: Install eccube-api4 documentation dependencies
        working-directory: external/eccube-api4/docs
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Build eccube-api4 documentation
        working-directory: external/eccube-api4/docs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --url "https://doc4.ec-cube.net" \
            --baseurl "/eccube-api4" \
            --destination "${GITHUB_WORKSPACE}/_site/eccube-api4"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4